<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura New Tab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #0b0d13;
      color: #e4e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 20px 25px;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header / Logo */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 2px 10px rgba(6, 182, 212, 0.35));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f0ff 0%, #b366ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Clock */
    .clock-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .clock-time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -2px;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    }

    .clock-date {
      font-size: 16px;
      font-weight: 400;
      color: #8c96a8;
      text-transform: capitalize;
      margin-top: 4px;
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      max-width: 660px;
      position: relative;
      margin-bottom: 45px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: rgba(26, 28, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 6px 14px 6px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .search-form:focus-within {
      border-color: rgba(160, 100, 255, 0.5);
      box-shadow: 0 10px 35px rgba(138, 75, 255, 0.2), 0 0 0 2px rgba(0, 229, 255, 0.25);
      background: rgba(30, 33, 50, 0.9);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      fill: #7c889b;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 17px;
      color: #ffffff;
      padding: 8px 0;
      user-select: text;
    }

    .search-input::placeholder {
      color: #647087;
    }

    .search-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #9b51e0 100%);
      border: none;
      outline: none;
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .search-btn:hover {
      opacity: 0.92;
      transform: scale(1.02);
    }

    /* Shortcuts Grid */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 660px;
      margin-bottom: 40px;
    }

    .shortcut-card {
      background: rgba(22, 24, 38, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #c0c8d6;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .shortcut-card:hover {
      background: rgba(36, 40, 62, 0.85);
      border-color: rgba(0, 229, 255, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    .shortcut-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.06);
    }

    .shortcut-title {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85px;
    }

    /* Footer info */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 820px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      color: #616e82;
      z-index: 1;
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ffaa;
      box-shadow: 0 0 10px #00ffaa;
    }

    .mem-badge {
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="../aura-logo.svg" alt="Aura Logo" class="logo-img">
      <span class="brand-title">AURA</span>
    </div>

    <div class="clock-section">
      <div class="clock-time" id="clock">00:00</div>
      <div class="clock-date" id="date">Понедельник, 1 января</div>
    </div>

    <div class="search-box">
      <form class="search-form" id="search-form" action="https://ya.ru/search/" method="get">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="search-input" name="text" id="search-input" placeholder="Поиск в Яндексе или URL..." autocomplete="off" autofocus>
        <button type="submit" class="search-btn">Найти</button>
      </form>
    </div>

    <div class="shortcuts-grid" id="shortcuts">
      <a href="https://ya.ru" class="shortcut-card">
        <div class="shortcut-icon" style="background:#ff3333; color:#fff;">Я</div>
        <div class="shortcut-title">Яндекс</div>
      </a>
      <a href="https://youtube.com" class="shortcut-card">
        <div class="shortcut-icon" style="background:#ff0000; color:#fff;">▶</div>
        <div class="shortcut-title">YouTube</div>
      </a>
      <a href="https://vk.com" class="shortcut-card">
        <div class="shortcut-icon" style="background:#0077ff; color:#fff;">В</div>
        <div class="shortcut-title">VK</div>
      </a>
      <a href="https://github.com" class="shortcut-card">
        <div class="shortcut-icon" style="background:#24292e; color:#fff;">GH</div>
        <div class="shortcut-title">GitHub</div>
      </a>
      <a href="https://web.telegram.org" class="shortcut-card">
        <div class="shortcut-icon" style="background:#229ed9; color:#fff;">✈</div>
        <div class="shortcut-title">Telegram</div>
      </a>
      <a href="https://kinopoisk.ru" class="shortcut-card">
        <div class="shortcut-icon" style="background:#ff6600; color:#fff;">КП</div>
        <div class="shortcut-title">Кинопоиск</div>
      </a>
    </div>
  </div>

  <footer class="footer">
    <div class="badge-status">
      <span class="status-dot"></span>
      <span>Aura Shield: Active (Private & No Telemetry)</span>
    </div>
    <div class="mem-badge" id="mem-status">RAM: Оптимизировано</div>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Check performance memory if exposed
    if (window.performance && window.performance.memory) {
      const usedMB = Math.round(window.performance.memory.usedJSHeapSize / (1024 * 1024));
      document.getElementById('mem-status').textContent = `JS Heap: ~${usedMB} MB`;
    }
  </script>
</body>
</html>
