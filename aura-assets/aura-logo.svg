<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Aura Ring Gradient -->
    <linearGradient id="auraRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Circular Ring -->
  <circle 
    cx="256" 
    cy="256" 
    r="204" 
    fill="none" 
    stroke="url(#auraRingGrad)" 
    stroke-width="36" 
    stroke-linecap="round"
    filter="url(#subtleGlow)"
  />

  <!-- Inner Geometric "A" -->
  <g filter="url(#subtleGlow)">
    <!-- Chevron / Legs of A -->
    <polyline 
      points="146,370 256,142 366,370" 
      fill="none" 
      stroke="url(#aGrad)" 
      stroke-width="32" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Cyan Horizontal Crossbar -->
    <line 
      x1="184" 
      y1="290" 
      x2="328" 
      y2="290" 
      stroke="#06B6D4" 
      stroke-width="26" 
      stroke-linecap="round" 
    />
  </g>
</svg>
